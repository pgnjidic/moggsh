<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0A0A0F;
      overflow: hidden;
    }
    #terminal {
      width: 100%;
      height: 100%;
    }
    /* xterm overrides */
    .xterm { height: 100% !important; }
    .xterm-viewport { overflow-y: auto !important; }
  </style>
  <link rel="stylesheet" href="xterm.css">
</head>
<body>
  <div id="terminal"></div>
  <!-- Off-screen compositor-force element. Toggling its opacity each wake tick
       makes Chromium produce an actual EGL swap, bypassing rAF throttling.
       The element is invisible and has zero layout impact. -->
  <div id="_cf" style="position:fixed;top:-2px;left:-2px;width:1px;height:1px;pointer-events:none;opacity:0"></div>

  <script src="xterm.js"></script>
  <script src="xterm-addon-fit.js"></script>
  <script src="xterm-addon-web-links.js"></script>
  <script src="xterm-addon-search.js"></script>

  <script>
    // Intercept requestAnimationFrame BEFORE xterm loads so we can flush its
    // render-debouncer callbacks manually from setInterval.
    // Android Chromium throttles rAF when no user gesture has occurred, so
    // xterm's internal canvas renderer never fires — leaving the canvas blank
    // even though the cursor (CSS animation) is visible.
    const _rafMap = new Map(); // ourId → { cb, nid }
    let _rafNextId = 1;
    const _nativeRAF = window.requestAnimationFrame.bind(window);
    const _nativeCAF = window.cancelAnimationFrame.bind(window);
    window.requestAnimationFrame = function(cb) {
      const id = _rafNextId++;
      const nid = _nativeRAF((ts) => { _rafMap.delete(id); cb(ts); });
      _rafMap.set(id, { cb, nid });
      return id;
    };
    window.cancelAnimationFrame = function(id) {
      const e = _rafMap.get(id);
      if (e) { _rafMap.delete(id); _nativeCAF(e.nid); }
      else _nativeCAF(id);
    };
    function _flushRAF() {
      if (_rafMap.size === 0) return;
      const ts = performance.now();
      for (const [id, e] of _rafMap) {
        _rafMap.delete(id);
        _nativeCAF(e.nid);
        try { e.cb(ts); } catch (_) {}
      }
    }

    const term = new Terminal({
      fontFamily: 'JetBrainsMono, "JetBrains Mono", "Courier New", monospace',
      fontSize: 14,
      lineHeight: 1.2,
      theme: {
        background:   '#0A0A0F',
        foreground:   '#E0E0E0',
        cursor:       '#00FF88',
        cursorAccent: '#0A0A0F',
        black:        '#1A1A24',
        red:          '#FF5555',
        green:        '#00FF88',
        yellow:       '#FFD700',
        blue:         '#00D4FF',
        magenta:      '#FF00FF',
        cyan:         '#00FFFF',
        white:        '#E0E0E0',
        brightBlack:  '#444466',
        brightRed:    '#FF7777',
        brightGreen:  '#33FF99',
        brightYellow: '#FFE44D',
        brightBlue:   '#33DDFF',
        brightMagenta:'#FF44FF',
        brightCyan:   '#44FFFF',
        brightWhite:  '#FFFFFF',
      },
      cursorBlink: true,
      allowTransparency: false,
      scrollback: 5000,
      convertEol: true,
      termName: 'xterm-256color',
    });

    const fitAddon = new FitAddon.FitAddon();
    const webLinksAddon = new WebLinksAddon.WebLinksAddon();
    const searchAddon = new SearchAddon.SearchAddon();

    term.loadAddon(fitAddon);
    term.loadAddon(webLinksAddon);
    term.loadAddon(searchAddon);

    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    // Pinch-to-zoom
    let initialDistance = null;
    let baseFontSize = term.options.fontSize;

    document.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        baseFontSize = term.options.fontSize;
      }
    });

    document.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialDistance !== null) {
        e.preventDefault();
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const scale = dist / initialDistance;
        const newSize = Math.min(18, Math.max(11, Math.round(baseFontSize * scale)));
        if (newSize !== term.options.fontSize) {
          term.options.fontSize = newSize;
          fitAddon.fit();
        }
      }
    }, { passive: false });

    document.addEventListener('touchend', () => { initialDistance = null; });

    // Single-finger touch scroll with inertia
    let scrollStartY = null;
    let scrollStartRow = 0;
    let currentScrollRow = 0;
    let velocityPxMs = 0;
    let inertiaRaf = null;
    // Ring buffer of recent touch points for stable velocity estimation
    const _th = []; // {y, t}

    function cancelInertia() {
      if (inertiaRaf !== null) { cancelAnimationFrame(inertiaRaf); inertiaRaf = null; }
    }

    document.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        cancelInertia();
        _th.length = 0;
        scrollStartY = e.touches[0].clientY;
        scrollStartRow = term.buffer.active.viewportY;
        currentScrollRow = scrollStartRow;
        velocityPxMs = 0;
        _th.push({ y: scrollStartY, t: e.timeStamp });
      }
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (e.touches.length !== 1 || scrollStartY === null) return;
      const y = e.touches[0].clientY;
      _th.push({ y, t: e.timeStamp });
      // Keep only last 80ms for velocity estimation
      while (_th.length > 1 && e.timeStamp - _th[0].t > 80) _th.shift();
      const rowH = term.options.fontSize * (term.options.lineHeight || 1.2);
      currentScrollRow = scrollStartRow + (scrollStartY - y) / rowH;
      term.scrollToLine(Math.round(currentScrollRow));
    }, { passive: true });

    document.addEventListener('touchend', () => {
      if (scrollStartY === null) return;
      scrollStartY = null;
      // Velocity from oldest→newest point in the window (more stable than last-pair delta)
      if (_th.length >= 2) {
        const a = _th[0], b = _th[_th.length - 1];
        const dt = b.t - a.t;
        if (dt > 0) velocityPxMs = (a.y - b.y) / dt;
      }
      if (Math.abs(velocityPxMs) < 0.05) return;
      const rowH = term.options.fontSize * (term.options.lineHeight || 1.2);
      // DECEL per ms — equivalent to ~0.96 per 16ms frame, giving a long, silky glide
      const DECEL_PER_MS = Math.pow(0.96, 1 / 16);
      let lastT = performance.now();
      function step(now) {
        const dt = Math.min(now - lastT, 64); // cap spike frames
        lastT = now;
        velocityPxMs *= Math.pow(DECEL_PER_MS, dt);
        if (Math.abs(velocityPxMs) < 0.008) { inertiaRaf = null; return; }
        currentScrollRow += velocityPxMs * dt / rowH;
        term.scrollToLine(Math.round(currentScrollRow));
        inertiaRaf = requestAnimationFrame(step);
      }
      inertiaRaf = requestAnimationFrame(step);
    }, { passive: true });

    // Compositor-force loop: toggling opacity on a tiny off-screen composited
    // element makes Chromium produce an EGL swap each tick, bypassing rAF
    // throttling. Android Chromium throttles rAF when no user gesture has
    // occurred, so term.refresh() alone (which uses rAF internally) never
    // flushes the canvas to the screen. The opacity toggle is the nudge.
    const _cfEl = document.getElementById('_cf');
    let _cfTick = 0;
    let _wakeTimer = null;
    function _wakeStop() {
      if (_wakeTimer !== null) { clearInterval(_wakeTimer); _wakeTimer = null; }
      _cfEl.style.opacity = '0';
    }
    function _wakeStart() {
      if (_wakeTimer !== null) return;
      let n = 0;
      _wakeTimer = setInterval(() => {
        // 1. Flush any rAF callbacks xterm scheduled (render-debouncer).
        //    setInterval is NOT throttled, so this bypasses Chromium's rAF
        //    throttling and forces xterm to actually draw to the canvas.
        _flushRAF();
        // 2. Nudge Chromium's compositor so it swaps the (now-drawn) canvas.
        _cfEl.style.opacity = (_cfTick++ & 1) ? '0' : '0.001';
        try { fitAddon.fit(); } catch (_) {}
        if (term.rows > 0) term.refresh(0, term.rows - 1);
        _flushRAF(); // flush the refresh rAF too
        term.focus();
        if (++n >= 25) _wakeStop();
      }, 80);
    }

    // Flutter → JS: full fit + repaint + focus. Needed when WebView becomes
    // visible after being laid out at 0×0 — xterm caches the zero geometry
    // and fit alone does not force a redraw of the internal framebuffer.
    window.termFit = () => {
      try { fitAddon.fit(); } catch (_) {}
      _flushRAF();
      term.refresh(0, Math.max(term.rows - 1, 0));
      _flushRAF();
      term.focus();
    };

    // Resize observer — use full termFit so size-from-zero transitions repaint
    new ResizeObserver(() => window.termFit()).observe(document.getElementById('terminal'));

    // Flutter → JS: write data to terminal.
    // On first write start the wake interval so the screen becomes visible
    // regardless of which async path (focus, rAF, Flutter fit) arrives first.
    window.termWrite = (data) => term.write(data, () => {
      term.scrollToBottom();
      _flushRAF(); // flush xterm's render-debouncer for this write
      if (term.rows > 0) term.refresh(0, term.rows - 1);
      _flushRAF();
      term.focus();
      _wakeStart();
    });

    // Flutter → JS: clear terminal
    window.termClear = () => term.clear();

    // Flutter → JS: set font size
    window.termSetFontSize = (size) => {
      term.options.fontSize = Math.min(18, Math.max(11, size));
      fitAddon.fit();
      // Re-fit after layout settles (WebView may not have final size yet)
      setTimeout(() => fitAddon.fit(), 150);
    };

    // Flutter → JS: force synchronous repaint (bypasses rAF throttle when WebView has no focus)
    window.termRefresh = () => {
      term.refresh(0, term.rows - 1);
      term.focus();
    };

    // Flutter → JS: search
    window.termSearch = (query) => searchAddon.findNext(query);

    // JS → Flutter: send user input
    term.onData((data) => {
      if (window.flutter_inappwebview) {
        window.flutter_inappwebview.callHandler('onInput', data);
      } else if (window.FlutterChannel) {
        window.FlutterChannel.postMessage(JSON.stringify({ type: 'input', data: data }));
      }
    });

    // JS → Flutter: terminal resized
    term.onResize(({ cols, rows }) => {
      if (window.FlutterChannel) {
        window.FlutterChannel.postMessage(JSON.stringify({ type: 'resize', cols: cols, rows: rows }));
      }
    });

    // Tap to focus / show keyboard on Android
    document.getElementById('terminal').addEventListener('click', () => {
      term.focus();
    });
    document.getElementById('terminal').addEventListener('touchend', () => {
      setTimeout(() => term.focus(), 50);
    });

    // Ready signal — send once, retry until FlutterChannel is available
    let _readySent = false;
    function sendReady() {
      if (_readySent) return;
      if (window.FlutterChannel) {
        _readySent = true;
        window.FlutterChannel.postMessage(JSON.stringify({ type: 'ready' }));
      } else {
        setTimeout(sendReady, 50);
      }
    }
    window.addEventListener('load', () => {
      fitAddon.fit();
      sendReady();
      // Re-fit after layout settles (WebView may have zero size during initial render)
      setTimeout(() => fitAddon.fit(), 100);
      setTimeout(() => fitAddon.fit(), 400);
    });
  </script>
</body>
</html>
