name: moggsh
description: "moggsh — SSH terminal client for Android, optimized for vibe coding."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  provider: ^6.1.2

  # Local storage
  hive_flutter: ^1.1.0

  # SSH
  dartssh2: ^2.9.0

  # Secure storage (SSH keys, credentials)
  flutter_secure_storage: ^9.2.2

  # Terminal emulator (WebView-based xterm.js)
  webview_flutter: ^4.10.0

  # Biometric auth for SSH key export
  local_auth: ^2.3.0

  # Voice to text
  speech_to_text: ^7.0.0

  # Utilities
  path_provider: ^2.1.5
  uuid: ^4.5.1
  wakelock_plus: ^1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/terminal/index.html
    - assets/terminal/xterm.js
    - assets/terminal/xterm.css
    - assets/terminal/xterm-addon-fit.js
    - assets/terminal/xterm-addon-web-links.js
    - assets/terminal/xterm-addon-search.js
    - assets/images/moggsh_logo_11.png
